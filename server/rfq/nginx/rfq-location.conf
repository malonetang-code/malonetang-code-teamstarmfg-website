location = /api/rfq {
    client_max_body_size 105m;
    limit_except POST OPTIONS { deny all; }

    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_param SCRIPT_FILENAME /opt/teamstar-rfq/current/public/index.php;
    fastcgi_param SCRIPT_NAME /api/rfq;
    fastcgi_param TEAMSTAR_RFQ_CONFIG /etc/teamstar-rfq/config.php;
    fastcgi_param PHP_VALUE "upload_max_filesize=25M\npost_max_size=105M\nmax_file_uploads=10\nmax_execution_time=90";
}

location ^~ /api/rfq/files/ {
    limit_except GET { deny all; }

    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_param SCRIPT_FILENAME /opt/teamstar-rfq/current/public/index.php;
    fastcgi_param SCRIPT_NAME /api/rfq/files;
    fastcgi_param TEAMSTAR_RFQ_CONFIG /etc/teamstar-rfq/config.php;
}
